<script type="text/x-dc" data-dc-script data-props='{"look":{"editor":"enum","options":["angel","garden","shepherd","choir","dove"],"default":"angel"},"pose":{"editor":"enum","options":["sit","stand","host","pull"],"default":"stand"},"present":{"editor":"boolean","default":false},"flap":{"editor":"boolean","default":false},"flip":{"editor":"boolean","default":false},"w":{"editor":null},"h":{"editor":null},"$preview":{"width":120,"height":200}}'>
var DRESS = {
  angel: ['#D3DFEC', '#95ABC4'],
  garden: ['#D3E6D6', '#93B39A'],
  shepherd: ['#E6D6B9', '#B9A37A'],
  choir: ['#DCCFEA', '#A794C2'],
  dove: ['#F1D7D3', '#C99F98']
};
class Component extends DCLogic {
  renderVals() {
    var look = DRESS[this.props.look] ? this.props.look : 'angel';
    var pose = ['sit', 'host', 'pull'].indexOf(this.props.pose) >= 0 ? this.props.pose : 'stand';
    var present = this.props.present === true || this.props.present === 'true';
    var flip = this.props.flip === true || this.props.flip === 'true';
    var stand = pose !== 'sit';
    var pull = pose === 'pull';
    var host = pose === 'host' || pull;
    var free = !(pull && !present);
    var on = function (b) { return b ? 'inline' : 'none'; };
    return {
      w: (Number(this.props.w) || 120) + 'px',
      h: (Number(this.props.h) || 200) + 'px',
      flipT: flip ? 'translate(60 0) scale(-1 1)' : 'translate(0 0)',
      headT: stand ? 'translate(0 0)' : 'translate(0 12)',
      dress: DRESS[look][0],
      dressLine: DRESS[look][1],
      flapA: (this.props.flap === true || this.props.flap === 'true') ? 'flap 0.3s ease-in-out infinite alternate' : 'none',
      standD: on(stand),
      pointD: on(pose === 'stand' || (pull && !present)),
      pointArmD: on(pose === 'stand'),
      pullD: on(pull),
      pullO: pull && !present ? 1 : 0,
      pullA: 'haul 1.6s ease-in-out infinite',
      pullB: 'haul 1.6s ease-in-out -0.8s infinite',
      freeO: free ? 1 : 0,
      hostArmO: (pose === 'host' || present) ? 1 : 0,
      hostD: on(host),
      hostEyesD: on(host && !(pull && !present)),
      armRot: host && present ? -86 : 0,
      turnT: host && present ? 'scaleX(0.9) rotate(3deg)' : (pull ? 'scaleX(1) rotate(-6deg)' : 'scaleX(1) rotate(0deg)'),
      restO: present ? 0 : 1,
      
      presO: present ? 1 : 0,
      sitD: on(!stand),
      wingsD: 'inline',
      angelD: on(look === 'angel'),
      gardenD: on(look === 'garden'),
      shepherdD: on(look === 'shepherd'),
      choirD: on(look === 'choir'),
      doveHairD: on(look === 'dove'),
      doveStandD: on(free && stand && look === 'dove'),
      doveSitD: on(!stand && look === 'dove'),
      collarD: on(look === 'choir'),
      crookD: on(free && look === 'shepherd'),
      flowerStandD: on(free && stand && look === 'garden'),
      bookStandD: on(free && stand && look === 'choir'),
      flowerSitD: on(!stand && look === 'garden'),
      bookSitD: on(!stand && look === 'choir'),
      lambD: on(!stand && look === 'shepherd')
    };
  }
}
</script>
</body>
</html>
