# Fly.io: the API and the worker as two process groups of one app, built from
# apps/server/Dockerfile. Deploy with scripts/go-live.sh, or by hand:
#   fly apps create prayertower-api && fly secrets import -a prayertower-api < deploy/production.env
#   fly deploy --ha=false
# Reference: https://fly.io/docs/reference/configuration/
app = "prayertower-api"
primary_region = "iad"

[build]
  dockerfile = "apps/server/Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  # Fly Proxy puts the visitor's address here (docs.fly.io/docs/networking/request-headers).
  CLIENT_IP_HEADER = "fly-client-ip"

# Same image, two commands (as in docker-compose.yml).
[processes]
  app = "node --import ./apps/server/dist/src/instrument.js apps/server/dist/src/server.js"
  worker = "node --import ./apps/server/dist/src/instrument.js apps/server/dist/src/worker.js"

[http_service]
  processes = ["app"]
  internal_port = 3000
  force_https = true
  # Keep the API up: push and the station worker expect it to answer at once.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
