name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request stops that pull request's older run (runs on main all finish).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Local Supabase stack (Postgres, Auth, Storage) in Docker; applies migrations.
      # Mailpit runs too: 20-password-reset reads the reset code from it. The script
      # frees taken ports, retries, moves to 553xx ports if it must, and waits for Postgres.
      - run: scripts/ci-db-start.sh
      # Server tests with a coverage report: fails below the thresholds in
      # apps/server/vitest.config.ts (docs/CODE_HEALTH.md).
      - run: npm run coverage
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('apps/server/coverage/coverage-summary.json') != '' }}
        run: |
          node -e '
            const t = require("./apps/server/coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered} of ${t[k].total} |`;
            console.log(["### Server test coverage", "", "| | Covered | |", "|---|---|---|", ...["lines", "statements", "functions", "branches"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: server-coverage
          path: apps/server/coverage/
          retention-days: 14
      - run: npm test -w @prayer-tower/station
      - run: npm test -w @prayer-tower/extension
      - name: Mobile unit tests (sign-in, feed, pray, commit, compose, tokens, messages)
        run: npm test -w @prayer-tower/mobile -- --ci
      # Back up the test database, restore it into a throwaway stack, compare.
      - run: scripts/restore-drill.sh

  # ESLint (server, station, shared, e2e, scripts and the app) and Knip
  # (unused files, dependencies and exports). docs/CODE_HEALTH.md.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run knip
      - name: Migration versions are unique
        run: scripts/check-migrations.sh

  # The native iPhone app's shared Swift code (apps/ios-native, docs/SWIFT_PORT.md):
  # the API kit and Supabase sign-in, built and unit-tested on Linux. The SwiftUI
  # screens build on a Mac (scripts/mac-build.sh).
  swift:
    runs-on: ubuntu-latest
    container: swift:6.4.1-noble
    defaults:
      run:
        working-directory: apps/ios-native
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  # The native iPhone app on a GitHub-hosted Mac (free for public repositories), headless:
  # the app, widgets and Mac console build; the accessibility audit on every skin, snapshots of
  # every main screen (light, dark, largest text) and the launch and 1,000-post scrolling
  # measurements run in the iPhone simulator (scripts/mac-build-native.sh). Snapshot images and
  # the logs are kept; a new snapshot is recorded on the first run and fails it once.
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    # contents: write lets the job commit newly recorded snapshot images back to the PR branch.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      # A snapshot that differs from its reference writes its new picture here (xcodebuild hands
      # TEST_RUNNER_ variables to the tests); a matching one writes nothing.
      - run: bash scripts/mac-build-native.sh
        env:
          TEST_RUNNER_SNAPSHOT_ARTIFACTS: ${{ runner.temp }}/snapshot-diffs
      # A snapshot test with no reference image records one and fails once. On a PR from this repo,
      # commit the new images to the branch so they show in the PR's diff for review (the job logs
      # and artifacts can't be fetched everywhere). Only new files: a changed screen still fails.
      - name: Commit newly recorded snapshots
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          dir=apps/ios-native/SnapshotTests/__Snapshots__
          [ -d "$dir" ] || exit 0
          git add "$dir"
          git diff --cached --quiet --diff-filter=A && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Native snapshots: record new reference images from CI"
          git push origin HEAD:${{ github.head_ref }}
      # The result table, first errors and performance numbers as annotations, so they can be
      # read from the checks API without downloading the logs.
      - name: Results as annotations
        if: ${{ !cancelled() }}
        run: |
          d=$(ls -d build-logs/native-* 2>/dev/null | grep -v derived | tail -1)
          [ -n "$d" ] || exit 0
          [ -s "$d/errors.txt" ] && head -40 "$d/errors.txt" | while IFS= read -r l; do echo "::error title=ios::${l//%/%25}"; done
          [ -s "$d/performance.txt" ] && head -20 "$d/performance.txt" | while IFS= read -r l; do echo "::notice title=performance::${l//%/%25}"; done
          grep -hE "Test Case .* failed|recorded|error:" "$d"/ui-walks.txt 2>/dev/null | sort -u | head -40 | while IFS= read -r l; do echo "::warning title=tests::${l//%/%25}"; done
          # The screen walk lists its audit issues on the lines after "Accessibility audit:".
          grep -h -A20 "Accessibility audit:" "$d"/ui-walks.txt 2>/dev/null | grep -E "^(Feed|My Promises|Messages|Notices|Me|Request)" | sort -u | head -30 | while IFS= read -r l; do echo "::warning title=walk audit::${l//%/%25}"; done
          # What was on screen when Apple flagged something without naming it (plain log lines).
          grep -h "WALKDIAG" "$d"/ui-walks.txt 2>/dev/null | head -400
          grep -h "BISECT" "$d"/ui-walks.txt 2>/dev/null | grep -v grep | head -20
          exit 0
      - name: Performance numbers
        if: ${{ !cancelled() }}
        run: |
          f=$(ls -d build-logs/native-*/performance.txt 2>/dev/null | tail -1)
          if [ -s "$f" ]; then { echo '### Native app performance'; echo '```'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
      # Only the pictures that differ from their references, only when the job fails, kept a day.
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: ios-snapshot-diffs
          path: ${{ runner.temp }}/snapshot-diffs
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: ios-logs
          path: |
            build-logs/native-*/*.txt
          if-no-files-found: ignore

  # Known vulnerabilities in dependencies. The server, station and shared
  # packages run in production, so any high one fails the build; the app's
  # build tooling (Expo CLI) fails only on critical. The full report is kept.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Server, station and shared (high or worse)
        run: npm audit --omit=dev --audit-level=high -w @prayer-tower/server -w @prayer-tower/station -w @prayer-tower/shared
      - name: Whole repo (critical)
        run: npm audit --audit-level=critical
      - name: Full report
        if: ${{ !cancelled() }}
        run: npm audit || true

  # Checks that app.json and the config plugins still generate both native
  # projects, and that the JS bundles for iOS and Android build. No signing or
  # compiling, so it runs on Linux in about two minutes.
  native:
    runs-on: ubuntu-latest
    env:
      EXPO_NO_GIT_STATUS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prebuild iOS and Android
        working-directory: apps/mobile
        run: npx expo prebuild --clean --no-install --platform all
      - name: Check app identifiers
        working-directory: apps/mobile
        run: |
          grep -q "applicationId 'com.zoomatech.prayertower'" android/app/build.gradle
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = "com.zoomatech.prayertower";' ios/*.xcodeproj/project.pbxproj
      - name: Check over-the-air update settings (docs/RELEASING_APPS.md)
        working-directory: apps/mobile
        env:
          EAS_PROJECT_ID: 00000000-0000-0000-0000-000000000000
        run: |
          npx expo prebuild --no-install --platform ios
          grep -q 'https://u.expo.dev/00000000-0000-0000-0000-000000000000' ios/*/Supporting/Expo.plist
          grep -q 'file:fingerprint' ios/*/Supporting/Expo.plist
          jq -e '.build.production.channel == "production"' eas.json
      - name: Bundle iOS and Android
        working-directory: apps/mobile
        run: npx expo export --platform ios --platform android --output-dir /tmp/native-dist

  # Playwright flows against the web build, the API and a local Supabase.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # No tests read email (sign-up confirmations are off), and skipping Mailpit avoids
      # the runner's port 54324 already being taken (seen 2026-10-28).
      - run: scripts/ci-db-start.sh
      - name: Point the app and API at the local stack
        run: |
          eval "$(npx supabase status -o env 2>/dev/null | grep -E '^[A-Z_0-9]+=' | sed 's/^/SB_/')"
          {
            echo "EXPO_PUBLIC_API_URL=http://127.0.0.1:3000"
            echo "EXPO_PUBLIC_SUPABASE_URL=$SB_API_URL"
            echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$SB_PUBLISHABLE_KEY"
          } > apps/mobile/.env
          {
            echo "SUPABASE_SECRET_KEY=$SB_SECRET_KEY"
            echo "SUPABASE_PUBLISHABLE_KEY=$SB_PUBLISHABLE_KEY"
            echo "PUSH_ENABLED=0"
            # One runner is one IP: the switches-on walks make thousands of requests a minute,
            # and at the default 300 the next spec's sign-in got "Rate limit exceeded".
            echo "RATE_LIMIT_PER_MINUTE=5000"
          } > apps/server/.env
      - run: npx playwright install --with-deps chromium
        working-directory: apps/e2e
      - run: npm run build:web -w @prayer-tower/e2e
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 14
