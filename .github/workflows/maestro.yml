# STEVE_TODO B10 on GitHub's runners: the Maestro flows in apps/mobile/.maestro drive the real iPhone app
# on an iOS Simulator. macOS runners have the Simulator but no Docker, so the local stack (Supabase, the
# demo members and the API) runs on a Linux runner and the Mac reaches it through two temporary
# Cloudflare tunnels that close when the run ends (Steve's choice, 2026-10-30). The two jobs pass the
# tunnel addresses and a "done" note as artifacts.
# Run it from the Actions tab, or it runs when the flows change. The report is the "maestro" artifact.
name: iPhone device tests

on:
  workflow_dispatch:
  pull_request:
    paths: [apps/mobile/.maestro/**, .github/workflows/maestro.yml]

permissions:
  contents: read
  actions: read

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: scripts/ci-db-start.sh
      - name: Load the demo members and start the API
        run: |
          eval "$(npx supabase status -o env 2>/dev/null | grep -E '^[A-Z_0-9]+=' | sed 's/^/SB_/')"
          {
            echo "SUPABASE_SECRET_KEY=$SB_SECRET_KEY"
            echo "SUPABASE_PUBLISHABLE_KEY=$SB_PUBLISHABLE_KEY"
            echo "PUSH_ENABLED=0"
            echo "RATE_LIMIT_PER_MINUTE=5000"
          } > apps/server/.env
          echo "SB_API_URL=$SB_API_URL" >> "$GITHUB_ENV"
          echo "SB_PUBLISHABLE_KEY=$SB_PUBLISHABLE_KEY" >> "$GITHUB_ENV"
          npm run seed:demo
          nohup npm run dev:api > api.log 2>&1 &
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/health > /dev/null 2>&1 && break; sleep 2; done
          curl -sS -o /dev/null -w 'API answers %{http_code}\n' http://127.0.0.1:3000/health
      - name: Open the tunnels
        run: |
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          nohup ./cloudflared tunnel --no-autoupdate --url http://127.0.0.1:3000 > tunnel-api.log 2>&1 &
          nohup ./cloudflared tunnel --no-autoupdate --url "$SB_API_URL" > tunnel-auth.log 2>&1 &
          url() { for _ in $(seq 1 60); do u=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' "$1" | head -1); [ -n "$u" ] && { echo "$u"; return; }; sleep 2; done; }
          API=$(url tunnel-api.log); AUTH=$(url tunnel-auth.log)
          [ -n "$API" ] && [ -n "$AUTH" ] || { cat tunnel-*.log; exit 1; }
          for _ in $(seq 1 60); do curl -fsS "$API/health" > /dev/null 2>&1 && break; sleep 3; done
          curl -sS -o /dev/null -w 'API through the tunnel answers %{http_code}\n' "$API/health"
          mkdir -p urls
          { echo "EXPO_PUBLIC_API_URL=$API"; echo "EXPO_PUBLIC_SUPABASE_URL=$AUTH"; echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$SB_PUBLISHABLE_KEY"; } > urls/mobile.env
      - uses: actions/upload-artifact@v4
        with:
          name: stack-urls
          path: urls/mobile.env
          retention-days: 1
      - name: Keep the stack up until the iPhone tests finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 200); do
            gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[].name' | grep -qx maestro-done && exit 0
            sleep 30
          done
          echo "The iPhone job never said it was done."
      - if: always()
        run: tail -150 api.log || true

  iphone:
    runs-on: macos-15
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      # Packages the app pulls in (Expo's 'apple') need Swift 6.2, so use the newest Xcode on the runner.
      - name: Use the newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Prebuild the iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean --no-install && (cd ios && pod install)
      - name: Wait for the stack's addresses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 120); do
            gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[].name' | grep -qx stack-urls && exit 0
            sleep 15
          done
          echo "The stack never came up." >&2; exit 1
      - uses: actions/download-artifact@v4
        with:
          name: stack-urls
          path: apps/mobile/stack
      # A Release build carries its JavaScript, so the tests need no Metro server.
      - name: Build the iPhone app for the Simulator
        working-directory: apps/mobile
        run: |
          cp stack/mobile.env .env
          WS=$(ls -d ios/*.xcworkspace | head -1)
          xcodebuild build -workspace "$WS" -scheme "$(basename "$WS" .xcworkspace)" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO > xcodebuild.log 2>&1 || { grep -A 6 -E ' error:|^error:' xcodebuild.log | head -80; exit 1; }
      - name: Start an iPhone Simulator and install the app
        working-directory: apps/mobile
        run: |
          RUNTIME=$(xcrun simctl list runtimes available -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="iOS"]; print(r[-1]["identifier"])')
          TYPE=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; t=[x["identifier"] for x in json.load(sys.stdin)["devicetypes"] if x["name"].startswith("iPhone") and "Pro" in x["name"] and "Max" not in x["name"]]; print(t[-1])')
          UDID=$(xcrun simctl create "Maestro iPhone" "$TYPE" "$RUNTIME")
          xcrun simctl boot "$UDID" && xcrun simctl bootstatus "$UDID" -b > /dev/null
          xcrun simctl install "$UDID" "$(ls -d build/Build/Products/Release-iphonesimulator/*.app | head -1)"
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      # The first start of Maestro's iOS driver on a fresh runner took over the default 2 minutes.
      - name: Run the flows
        working-directory: apps/mobile
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 600000
          MAESTRO_CLI_NO_ANALYTICS: 1
        # Maestro's iOS driver on these runners sometimes drops ("Device became unreachable") or
        # doesn't start, so each flow runs on its own and gets a second try when it fails.
        run: |
          failed=""
          for f in .maestro/0*.yaml; do
            n=$(basename "$f" .yaml)
            maestro test "$f" --format=JUNIT --output="maestro-$n.xml" --test-output-dir="maestro-output/$n" \
              || { echo "Trying $n again"; maestro test "$f" --format=JUNIT --output="maestro-$n.xml" --test-output-dir="maestro-output/$n-retry"; } \
              || failed="$failed $n"
          done
          python3 -c 'import sys,glob; parts=[open(x).read().split("<testsuites>",1)[1].rsplit("</testsuites>",1)[0] for x in sorted(glob.glob("maestro-0*.xml"))]; open("maestro-report.xml","w").write("<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<testsuites>"+"".join(parts)+"</testsuites>\n")' || true
          [ -z "$failed" ] || { echo "Failed:$failed"; exit 1; }
      # Artifacts need a browser sign-in to download, so the reasons go in the log too.
      - name: Show why flows failed
        if: failure()
        working-directory: apps/mobile
        run: |
          # One line per flow: name, result and the first line of the reason (stack traces are in the artifact).
          python3 -c 'import sys,xml.etree.ElementTree as E; [print(c.get("name"), "->", c.get("status"), ((c.find("failure").text or "").splitlines() or [""])[0][:300] if c.find("failure") is not None else "") for c in E.parse(sys.argv[1]).iter("testcase")]' maestro-report.xml 2>/dev/null || true
          for f in $(find maestro-output -name 'commands-*.json' 2>/dev/null); do
            echo "== $f"
            python3 -c 'import json,sys; [print(json.dumps(c.get("command"))[:300], "->", (c.get("metadata") or {}).get("status"), ((c.get("metadata") or {}).get("error") or {}).get("message","")) for c in json.load(open(sys.argv[1]))]' "$f" | tail -8
          done
          find maestro-output -name 'maestro.log' -exec tail -40 {} \; 2>/dev/null | grep -iE 'error|fail|exception' | head -30 || true
          # A crash: React Native logs the JavaScript error before it aborts, and iOS keeps a crash report.
          xcrun simctl spawn booted log show --last 15m --style compact --predicate 'process == "PrayerTower"' 2>/dev/null \
            | grep -iE 'unhandled|exception|fatal|error|abort|invariant' | grep -vE 'nw_|xctest|XPCErrors' | sort -u | head -40 || true
          # A menu bar build error names the bad command on the lines before UIKit's breakpoint hint.
          xcrun simctl spawn booted log show --last 15m --style compact --predicate 'process == "PrayerTower"' 2>/dev/null \
            | grep -B 6 '_UIMenuBuilderError' | head -40 || true
          for r in $(ls -t ~/Library/Logs/DiagnosticReports/PrayerTower*.ips 2>/dev/null | head -1); do
            echo "== $r"; python3 -c 'import json,sys; t=open(sys.argv[1]).read().split("\n",1)[1]; j=json.loads(t); print(json.dumps(j.get("exception")), json.dumps(j.get("asi"))[:2000]); fr=j["threads"][j.get("faultingThread",0)]["frames"][:25]; imgs=j.get("usedImages",[]); [print(imgs[x["imageIndex"]].get("name","?"), x.get("symbol","")) for x in fr]' "$r" || head -c 4000 "$r"
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro
          path: |
            apps/mobile/maestro-report.xml
            apps/mobile/maestro-output/
            apps/mobile/xcodebuild.log
          retention-days: 14
          if-no-files-found: warn
      - if: always()
        run: mkdir -p done && date > done/done.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-done
          path: done/done.txt
          retention-days: 1
