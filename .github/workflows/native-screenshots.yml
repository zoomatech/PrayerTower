# App Store screenshots of the native apps, taken on GitHub's macOS runner (it has the iOS
# Simulator runtimes, so nothing runs on a member's Mac). Run it from the Actions tab, or it runs
# when the screenshot script changes. The pictures are kept as the "native-screenshots" artifact.
name: Native screenshots

on:
  workflow_dispatch:
    inputs:
      qa:
        description: Also take Dark Mode and largest-text pictures for checking
        type: boolean
        default: false
      walks:
        description: Also run the native build, tests and UI walks (with the accessibility audit)
        type: boolean
        default: false
  pull_request:
    paths: [scripts/mac-screenshots-native.sh, .github/workflows/native-screenshots.yml, apps/ios-native/App/Skins/**]

jobs:
  screenshots:
    runs-on: macos-15
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build, tests and UI walks
        if: ${{ inputs.walks }}
        shell: bash
        run: |
          bash scripts/mac-build-native.sh > native-build.txt 2>&1 || true
          grep -E "PASS|FAIL" native-build.txt | while IFS= read -r l; do echo "::notice title=native build::$l"; done || true
          f=$(ls -d build-logs/native-*/ | tail -1)
          grep -hE "error:|^(Feed|My Promises|Messages|Notices|Me|Request): " "$f"ui-walks.txt 2>/dev/null | sort -u | head -80 | while IFS= read -r l; do echo "::warning title=ui walks::$l"; done || true
          # The whole log rides along on the native-screenshots branch (annotations stop at 10).
          mkdir -p store-screenshots/native-qa && cp native-build.txt "$f"ui-walks.txt store-screenshots/native-qa/ 2>/dev/null || true
      - shell: bash
        run: mkdir -p build-logs/screenshots-run && QA=${{ inputs.qa && 1 || 0 }} bash scripts/mac-screenshots-native.sh prayertower 2>&1 | tee build-logs/screenshots-run/prayertower.txt
      - shell: bash
        run: mkdir -p build-logs/screenshots-run && QA=${{ inputs.qa && 1 || 0 }} bash scripts/mac-screenshots-native.sh opencircle 2>&1 | tee build-logs/screenshots-run/opencircle.txt
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: native-screenshots
          path: store-screenshots/native
          if-no-files-found: warn
      # A run from the Actions tab also keeps the pictures on the native-screenshots branch, so
      # they can be fetched with git (artifacts need a browser sign-in to download).
      - name: Keep the pictures on the native-screenshots branch
        if: ${{ success() && github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          if git fetch -q origin native-screenshots; then
            git worktree add -q -B native-screenshots "$RUNNER_TEMP/shots" origin/native-screenshots
          else
            git worktree add -q --orphan -b native-screenshots "$RUNNER_TEMP/shots"
          fi
          find "$RUNNER_TEMP/shots" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R store-screenshots/native/. "$RUNNER_TEMP/shots/"
          [ -d store-screenshots/native-qa ] && cp -R store-screenshots/native-qa "$RUNNER_TEMP/shots/qa"
          cd "$RUNNER_TEMP/shots"
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Native store screenshots from ${GITHUB_SHA::7}" || exit 0
          git push -q origin native-screenshots
      - name: Show what happened
        if: ${{ !cancelled() }}
        run: |
          for f in build-logs/screenshots-*/*.txt build-logs/native-*/*.txt; do
            [ -f "$f" ] || continue
            case "$f" in */screenshots-run/*) tail -25 "$f" | while IFS= read -r l; do echo "::notice title=$f::$l"; done; continue ;; esac
            grep -hE "error:|FAIL|failed|Unable" "$f" | sort -u | head -15 | while IFS= read -r l; do echo "::error title=$f::$l"; done || true
          done
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: native-screenshots-logs
          path: build-logs/screenshots-*/*.txt
          if-no-files-found: ignore
