# The native app's build, UI walks and accessibility audits on GitHub's macOS runner (it has Xcode and the iOS
# Simulator runtimes; standard runners are free for public repositories). Nothing runs on a member's Mac, which
# has no room for a Simulator. Runs scripts/mac-build-native.sh: the shared package's tests, both apps, the Mac
# app and console, then the UI walks (UIWalks/) and audits (UITests/) on an iPhone Simulator, headless.
name: Native UI walks

on:
  workflow_dispatch:
  pull_request:
    paths: [apps/ios-native/**, scripts/mac-build-native.sh, .github/workflows/native-ui-walks.yml]

concurrency:
  group: native-ui-walks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  walks:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Build and walk
        shell: bash
        run: bash scripts/mac-build-native.sh 2>&1 | tee walks.txt; exit "${PIPESTATUS[0]}"
      - name: Summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo '### Native build and UI walks'
            echo '```'
            awk '/^(Shared tests|Xcode project|iPhone app|Open Circle|Mac app|Mac console|UI walks|Audits)/' walks.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -hE "error:|failed" build-logs/native-*/errors.txt 2>/dev/null | head -20 | while IFS= read -r l; do echo "::error::$l"; done || true
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: native-ui-walks-logs
          path: build-logs/native-*/*.txt
          if-no-files-found: ignore
