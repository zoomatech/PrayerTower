<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prayer Tower Cross-posting</title>
    <style>
      /* Light and dark follow the device (Apple asks Safari extensions to support Dark Mode). */
      :root { color-scheme: light dark; --text: #1f2937; --muted: #4b5563; --line: #d1d5db; --accent: #1d4ed8; --ok: #047857; --bad: #b45309; }
      @media (prefers-color-scheme: dark) {
        :root { --text: #e5e7eb; --muted: #9ca3af; --line: #4b5563; --accent: #3b82f6; --ok: #34d399; --bad: #fbbf24; }
      }
      /* On iPhone and iPad, text follows the member's Text Size setting (Dynamic Type). */
      @supports (font: -apple-system-body) { body { font: -apple-system-body; } }
      body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 16px; min-width: 300px; max-width: 520px; color: var(--text); line-height: 1.45; }
      h1 { font-size: 18px; margin: 0 0 8px; }
      label { display: block; font-weight: 600; margin-top: 12px; }
      input[type='url'], input[type='password'] { width: 100%; box-sizing: border-box; padding: 8px; font-size: 16px; border: 1px solid var(--line); border-radius: 8px; }
      .row { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
      button { padding: 8px 14px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; min-height: 44px; font-size: 14px; cursor: pointer; }
      .note { font-size: 0.9em; color: var(--muted); }
      .ok { color: var(--ok); }
      .bad { color: var(--bad); }
      ul { padding-left: 18px; font-size: 0.9em; }
    </style>
  </head>
  <body>
    <h1>Prayer Tower Cross-posting</h1>
    <p class="note">When you click Post on Facebook or Threads, the same words, photos and videos go to your own Prayer Tower (or Open Circle) account. Get your key in the app: Me → Copy my Facebook posts.</p>
    <label for="server">Server address (shown in the app)</label>
    <input id="server" type="url" placeholder="https://api.example.org" autocomplete="off" />
    <label for="key">Your extension key</label>
    <input id="key" type="password" placeholder="ptx_…" autocomplete="off" />
    <div class="row"><input id="enabled" type="checkbox" /><label for="enabled" style="margin: 0; font-weight: 400">Copy my posts</label></div>
    <div class="row"><button id="save">Save</button><span id="status" class="note" role="status"></span></div>
    <h2 style="font-size: 15px; margin-top: 20px">Recent</h2>
    <ul id="recent"></ul>
    <script src="options.js"></script>
  </body>
</html>
