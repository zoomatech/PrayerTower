# The native iPhone app (docs/SWIFT_PORT.md). Not the pilot: the Expo app in
# apps/mobile stays the pilot. Generate the Xcode project on a Mac with
#   brew install xcodegen && xcodegen generate
# (scripts/mac-build-native.sh first builds the Safari extension into Crosspost/<edition>/;
# run it once, or `node ../extension/scripts/build.mjs prayertower --safari` and copy dist/ there.)
# then open PrayerTowerNative.xcodeproj. Shared code is the Swift package in this
# folder (PrayerTowerKit, PrayerTowerSession), tested on Linux in CI.
name: PrayerTowerNative
options:
  bundleIdPrefix: com.zoomatech
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  PrayerTowerKit:
    path: .
targets:
  PrayerTowerNative:
    type: application
    platform: iOS
    sources: [App, Shared]
    # A shared scheme, so scripts/mac-build-native.sh can build and test with xcodebuild -scheme.
    scheme:
      testTargets: [PrayerTowerUIWalks]
    dependencies:
      - package: PrayerTowerKit
        products:
          - PrayerTowerKit
          - PrayerTowerSession
      # The Pray now widget and the Praying for you Live Activity, embedded in the app.
      - target: PrayerTowerWidgets
      # Cross-posting in Safari (apps/extension), embedded in the app as a Safari web extension.
      - target: PrayerTowerCrosspost
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Prayer Tower
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Listen decodes radio bursts from the microphone or an audio input. The sound stays on this phone.
        # Widget and Live Activity taps open prayertower:///post/<id>.
        CFBundleURLTypes:
          - CFBundleURLName: com.zoomatech.prayertower.native
            CFBundleURLSchemes: [prayertower]
        NSSupportsLiveActivities: true
        # Filled from Config.xcconfig (copy Config.example.xcconfig); never committed with real values.
        PTSupabaseURL: $(PT_SUPABASE_URL)
        PTSupabaseKey: $(PT_SUPABASE_KEY)
        PTApiURL: $(PT_API_URL)
        # The site shared links point to (opens the app when installed); blank uses PT_API_URL.
        PTLinkURL: $(PT_LINK_URL)
        # Shown with the rules and at sign-up; blank hides the link.
        PTTermsURL: $(PT_TERMS_URL)
        PTPrivacyURL: $(PT_PRIVACY_URL)
        PTSupportEmail: $(PT_SUPPORT_EMAIL)
        PTEdition: prayer-tower
    entitlements:
      path: App/PrayerTowerNative.entitlements
      properties:
        # Passkeys: the domain that serves /.well-known/apple-app-site-association (webcredentials).
        com.apple.developer.associated-domains: ["webcredentials:$(PT_PASSKEY_DOMAIN)"]
        # Shared with the widget extension (PrayNow.appGroup in PrayerTowerKit).
        com.apple.security.application-groups: [group.com.zoomatech.prayertower.native]
    settings:
      base:
        # A separate bundle id from the Expo pilot (com.zoomatech.prayertower) until the native app replaces it.
        PRODUCT_BUNDLE_IDENTIFIER: com.zoomatech.prayertower.native
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig

  # The separately branded, non-religious edition (Steve, 2026-10-28), as the Expo app's
  # EXPO_PUBLIC_EDITION=open-circle: the same screens, always the neutral words, its own name,
  # bundle id and link scheme, and new members join the Open Circle community. "Open Circle" is
  # a placeholder name until Steve picks one.
  OpenCircleNative:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist, PrayerTowerNative.entitlements]
      - Shared
    scheme: {}
    dependencies:
      - package: PrayerTowerKit
        products:
          - PrayerTowerKit
          - PrayerTowerSession
      - target: OpenCircleWidgets
      - target: OpenCircleCrosspost
    info:
      path: OpenCircle/Info.plist
      properties:
        CFBundleDisplayName: Open Circle
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Listen decodes radio bursts from the microphone or an audio input. The sound stays on this phone.
        CFBundleURLTypes:
          - CFBundleURLName: com.zoomatech.opencircle.native
            CFBundleURLSchemes: [opencircle]
        NSSupportsLiveActivities: true
        PTSupabaseURL: $(PT_SUPABASE_URL)
        PTSupabaseKey: $(PT_SUPABASE_KEY)
        PTApiURL: $(PT_API_URL)
        # The site shared links point to (opens the app when installed); blank uses PT_API_URL.
        PTLinkURL: $(PT_LINK_URL)
        PTTermsURL: $(PT_TERMS_URL)
        PTPrivacyURL: $(PT_PRIVACY_URL)
        PTSupportEmail: $(PT_SUPPORT_EMAIL)
        PTEdition: open-circle
    entitlements:
      path: OpenCircle/OpenCircleNative.entitlements
      properties:
        com.apple.developer.associated-domains: ["webcredentials:$(PT_PASSKEY_DOMAIN)"]
        com.apple.security.application-groups: [group.com.zoomatech.opencircle.native]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zoomatech.opencircle.native
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig

  PrayerTowerWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets]
    dependencies:
      - package: PrayerTowerKit
        products:
          - PrayerTowerKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Prayer Tower
        PTEdition: prayer-tower
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/PrayerTowerWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.zoomatech.prayertower.native]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zoomatech.prayertower.native.widgets
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

  # Open Circle's own Pray now widget and Live Activity: the same code with its edition's words,
  # link scheme and app group.
  OpenCircleWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes: [Info.plist, PrayerTowerWidgets.entitlements]
    dependencies:
      - package: PrayerTowerKit
        products:
          - PrayerTowerKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: OpenCircleWidgets/Info.plist
      properties:
        CFBundleDisplayName: Open Circle
        PTEdition: open-circle
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: OpenCircleWidgets/OpenCircleWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.zoomatech.opencircle.native]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zoomatech.opencircle.native.widgets
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

  # Cross-posting in Safari on iPhone and iPad: the browser extension in apps/extension, built for
  # Safari into Crosspost/prayertower/ by scripts/mac-build-native.sh (node apps/extension/scripts/build.mjs
  # prayertower --safari), as Apple's safari-web-extension-packager lays it out.
  PrayerTowerCrosspost:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Crosspost/SafariWebExtensionHandler.swift
      - path: Crosspost/prayertower/manifest.json
        buildPhase: resources
      - path: Crosspost/prayertower/icons
        type: folder
        buildPhase: resources
      - path: Crosspost/prayertower/src
        type: folder
        buildPhase: resources
    dependencies:
      - sdk: SafariServices.framework
    info:
      path: Crosspost/PrayerTowerCrosspost-Info.plist
      properties:
        CFBundleDisplayName: Prayer Tower Cross-posting
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zoomatech.prayertower.native.crosspost
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

  # Cross-posting in Safari on iPhone and iPad: the browser extension in apps/extension, built for
  # Safari into Crosspost/opencircle/ by scripts/mac-build-native.sh (node apps/extension/scripts/build.mjs
  # opencircle --safari), as Apple's safari-web-extension-packager lays it out.
  OpenCircleCrosspost:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Crosspost/SafariWebExtensionHandler.swift
      - path: Crosspost/opencircle/manifest.json
        buildPhase: resources
      - path: Crosspost/opencircle/icons
        type: folder
        buildPhase: resources
      - path: Crosspost/opencircle/src
        type: folder
        buildPhase: resources
    dependencies:
      - sdk: SafariServices.framework
    info:
      path: Crosspost/OpenCircleCrosspost-Info.plist
      properties:
        CFBundleDisplayName: Open Circle Cross-posting
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zoomatech.opencircle.native.crosspost
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

  # UI walks of the main screens on the Simulator, with the app's on-device sample data
  # (-PTSampleData): no server or account. Run headless by scripts/mac-build-native.sh.
  PrayerTowerUIWalks:
    type: bundle.ui-testing
    platform: iOS
    sources: [UIWalks]
    dependencies:
      - target: PrayerTowerNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zoomatech.prayertower.native.uiwalks
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

  # The Mac operator console for the station's control operator (Console/, docs/SWIFT_PORT.md):
  # the operator console, station health, keying controls and a menu bar item, in place of the web console.
  PrayerTowerConsole:
    type: application
    platform: macOS
    # macOS 15 for defaultLaunchBehavior, so the console window opens at launch.
    deploymentTarget: "15.0"
    sources: [Console, Shared]
    scheme: {}
    dependencies:
      - package: PrayerTowerKit
        products:
          - PrayerTowerKit
          - PrayerTowerSession
    info:
      path: Console/Info.plist
      properties:
        CFBundleDisplayName: Prayer Tower Console
        LSApplicationCategoryType: public.app-category.utilities
        NSMicrophoneUsageDescription: Listener mode decodes Prayer Tower radio bursts from the microphone or a receiver's audio input. The sound stays on this Mac.
        PTSupabaseURL: $(PT_SUPABASE_URL)
        PTSupabaseKey: $(PT_SUPABASE_KEY)
        PTApiURL: $(PT_API_URL)
    entitlements:
      path: Console/PrayerTowerConsole.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Listener mode (Shared/ListenView.swift) reads an audio input.
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zoomatech.prayertower.console
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
