# The native iPhone app (docs/SWIFT_PORT.md). Not the pilot: the Expo app in
# apps/mobile stays the pilot. Generate the Xcode project on a Mac with
#   brew install xcodegen && xcodegen generate
# then open PrayerTowerNative.xcodeproj. Shared code is the Swift package in this
# folder (PrayerTowerKit, PrayerTowerSession), tested on Linux in CI.
name: PrayerTowerNative
options:
  bundleIdPrefix: com.zoomatech
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  PrayerTowerKit:
    path: .
targets:
  PrayerTowerNative:
    type: application
    platform: iOS
    sources: [App]
    # A shared scheme, so scripts/mac-build-native.sh can build with xcodebuild -scheme.
    scheme: {}
    dependencies:
      - package: PrayerTowerKit
        products:
          - PrayerTowerKit
          - PrayerTowerSession
      # The Pray now widget and the Praying for you Live Activity, embedded in the app.
      - target: PrayerTowerWidgets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Prayer Tower
        UILaunchScreen: {}
        # Widget and Live Activity taps open prayertower:///post/<id>.
        CFBundleURLTypes:
          - CFBundleURLName: com.zoomatech.prayertower.native
            CFBundleURLSchemes: [prayertower]
        NSSupportsLiveActivities: true
        # Filled from Config.xcconfig (copy Config.example.xcconfig); never committed with real values.
        PTSupabaseURL: $(PT_SUPABASE_URL)
        PTSupabaseKey: $(PT_SUPABASE_KEY)
        PTApiURL: $(PT_API_URL)
        # The site shared links point to (opens the app when installed); blank uses PT_API_URL.
        PTLinkURL: $(PT_LINK_URL)
        # Shown with the rules and at sign-up; blank hides the link.
        PTTermsURL: $(PT_TERMS_URL)
        PTPrivacyURL: $(PT_PRIVACY_URL)
        PTSupportEmail: $(PT_SUPPORT_EMAIL)
        PTEdition: prayer-tower
    entitlements:
      path: App/PrayerTowerNative.entitlements
      properties:
        # Passkeys: the domain that serves /.well-known/apple-app-site-association (webcredentials).
        com.apple.developer.associated-domains: ["webcredentials:$(PT_PASSKEY_DOMAIN)"]
        # Shared with the widget extension (PrayNow.appGroup in PrayerTowerKit).
        com.apple.security.application-groups: [group.com.zoomatech.prayertower.native]
    settings:
      base:
        # A separate bundle id from the Expo pilot (com.zoomatech.prayertower) until the native app replaces it.
        PRODUCT_BUNDLE_IDENTIFIER: com.zoomatech.prayertower.native
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig

  # The separately branded, non-religious edition (Steve, 2026-10-28), as the Expo app's
  # EXPO_PUBLIC_EDITION=open-circle: the same screens, always the neutral words, its own name,
  # bundle id and link scheme, and new members join the Open Circle community. "Open Circle" is
  # a placeholder name until Steve picks one. The home-screen widget comes later.
  OpenCircleNative:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist, PrayerTowerNative.entitlements]
    scheme: {}
    dependencies:
      - package: PrayerTowerKit
        products:
          - PrayerTowerKit
          - PrayerTowerSession
    info:
      path: OpenCircle/Info.plist
      properties:
        CFBundleDisplayName: Open Circle
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.zoomatech.opencircle.native
            CFBundleURLSchemes: [opencircle]
        NSSupportsLiveActivities: true
        PTSupabaseURL: $(PT_SUPABASE_URL)
        PTSupabaseKey: $(PT_SUPABASE_KEY)
        PTApiURL: $(PT_API_URL)
        # The site shared links point to (opens the app when installed); blank uses PT_API_URL.
        PTLinkURL: $(PT_LINK_URL)
        PTTermsURL: $(PT_TERMS_URL)
        PTPrivacyURL: $(PT_PRIVACY_URL)
        PTSupportEmail: $(PT_SUPPORT_EMAIL)
        PTEdition: open-circle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zoomatech.opencircle.native
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig

  PrayerTowerWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets]
    dependencies:
      - package: PrayerTowerKit
        products:
          - PrayerTowerKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Prayer Tower
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/PrayerTowerWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.zoomatech.prayertower.native]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zoomatech.prayertower.native.widgets
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

  # The Mac operator console for the station's control operator (Console/, docs/SWIFT_PORT.md):
  # the operator console, station health, keying controls and a menu bar item, in place of the web console.
  PrayerTowerConsole:
    type: application
    platform: macOS
    # macOS 15 for defaultLaunchBehavior, so the console window opens at launch.
    deploymentTarget: "15.0"
    sources: [Console]
    scheme: {}
    dependencies:
      - package: PrayerTowerKit
        products:
          - PrayerTowerKit
          - PrayerTowerSession
    info:
      path: Console/Info.plist
      properties:
        CFBundleDisplayName: Prayer Tower Console
        LSApplicationCategoryType: public.app-category.utilities
        PTSupabaseURL: $(PT_SUPABASE_URL)
        PTSupabaseKey: $(PT_SUPABASE_KEY)
        PTApiURL: $(PT_API_URL)
    entitlements:
      path: Console/PrayerTowerConsole.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zoomatech.prayertower.console
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
