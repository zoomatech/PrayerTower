# Sign in with the wrong password (refused), then the right one.
appId: ${APP_ID}
name: Sign in
tags: [smoke]
env:
  APP_ID: com.zoomatech.prayertower
  EMAIL: carol@demo.prayertower.local
  PASSWORD: praying-demo-1
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny
- extendedWaitUntil:
    visible:
      id: sign-in-email
    timeout: 20000
- tapOn:
    id: sign-in-email
- inputText: ${EMAIL}
- tapOn:
    id: sign-in-password
- inputText: wrong-password-1
- hideKeyboard
- tapOn:
    id: sign-in-submit
- assertNotVisible: Prayers
- runFlow:
    file: subflows/sign-in.yaml
    env:
      APP_ID: ${APP_ID}
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
- assertVisible: Prayers
