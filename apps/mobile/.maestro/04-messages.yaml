# Carol opens her conversation with Ethel and sends a message.
appId: ${APP_ID}
name: Send a message
tags: [smoke]
env:
  APP_ID: com.zoomatech.prayertower
  EMAIL: carol@demo.prayertower.local
  PASSWORD: praying-demo-1
---
- runFlow:
    file: subflows/sign-in.yaml
    env:
      APP_ID: ${APP_ID}
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
# Messages is in the menu under the Home button now (Steve, 2026-10-30).
- tapOn:
    id: corner-menu
- tapOn: Messages
# A conversation row is one button whose label also holds the kind and the last message.
- tapOn:
    text: ".*Demo Ethel.*"
    index: 0
- evalScript: "${output.message = 'Maestro: praying with you (' + Date.now() + ')'}"
- tapOn:
    id: message-input
- inputText: ${output.message}
# No hideKeyboard: on iOS it fails here, and the send button sits above the keyboard.
- tapOn:
    id: message-send
- assertVisible: ${output.message}
